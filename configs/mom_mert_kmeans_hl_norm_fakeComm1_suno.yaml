# MERT-only H+L MoE on normalised MoM-CLAM.
# Tokens: MERT-v0 frames -> per-layer kmeans (K=1024), layers [L0, L1, L11, L12] stacked as (4, T) int16.
#   Channel 0 = MERT L0 (CNN)     -> low expert
#   Channel 1 = MERT L1           -> low expert
#   Channel 2 = MERT L11          -> high expert
#   Channel 3 = MERT L12 (top)    -> high expert
# NO semantic expert (this is H+L only, to isolate token-stream contribution).
# Fake-Comm1: train fake = Suno-v3.5 only at the same N and held-out target as Fake-Comm (1-vs-2-family control).
data:
  token_dir: ${COMOE_DATA_ROOT}/tokens_mom_norm/mert_v0_kmeans1024_L0_L1_L11_L12
  meta_csv: data/splits/metadata_mom_norm.csv
  split_train: data/splits/split_mom_train_norm_fakeComm1_suno.json
  split_val: data/splits/split_mom_val_norm_fakeComm1_suno.json
  split_ood: data/splits/split_mom_ood_norm_fakeComm1_suno.json
  codebook_size: 1024
  n_codebooks: 4
  max_frames: 1500
  crop_frames: 1500

model:
  d_model: 256
  n_heads: 4
  n_layers: 4
  dropout: 0.2
  fusion: late_mean
  low_layers: [0, 1]
  high_layers: [2, 3]
  use_semantic: false
  use_low: true
  use_high: true
  use_latent: false

train:
  batch_size: 96
  num_workers: 8
  lr: 2.0e-4
  weight_decay: 0.01
  epochs: 12
  warmup_steps: 200
  grad_clip: 1.0
  label_smoothing: 0.05
  seed: 42
  device: cuda
  amp: true
  log_every_steps: 25
  save_dir: runs/mom_mert_kmeans_hl_norm_fakeComm1_suno

wandb:
  enabled: false
  project: comoe
  name: mom_mert_kmeans_hl_norm_fakeComm1_suno
  mode: offline
