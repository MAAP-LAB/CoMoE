[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comoe"
version = "0.1.0"
description = "CoMoE: a fixed four-stream token classifier for comparing audio token spaces under generator shift"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy<2",
    "pyyaml",
    "scikit-learn",
    "pandas",
]

[tool.setuptools]
packages = ["comoe", "baselines", "baselines.clam"]
